  <title>流芳百世 - 互动电子书</title>
  <style>

    footer { min-height:64px; display:flex; align-items:center; gap:18px; padding:14px clamp(18px,4vw,56px); border-top:1px solid var(--line); font:12px/1 system-ui,sans-serif; color:#d5d2c9; }
    #label { min-width:84px; } input[type=range] { flex:1; accent-color:#d1a474; cursor:pointer; } .hint { opacity:.7; white-space:nowrap; }
    dialog { width:min(760px,92vw); max-height:78vh; color:var(--ink); background:#f5f2ea; border:0; border-radius:12px; padding:0; box-shadow:0 26px 80px #000; } dialog::backdrop { background:rgba(0,0,0,.67); backdrop-filter:blur(4px); }
    .toc-head { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 12px; border-bottom:1px solid #d8d3c8; } .toc-head h2 { margin:0; font-size:18px; font-weight:600; }
    #toc { padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:10px; overflow:auto; max-height:62vh; }
    .thumb { color:#403f3b; text-align:left; background:#fff; padding:6px; border-radius:5px; box-shadow:0 1px 5px #bdb8ae; } .thumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#ddd; } .thumb span { display:block; font-size:11px; padding:6px 2px 1px; } .thumb[aria-current=true] { outline:3px solid var(--accent); }
    @media (max-width:620px) { header { min-height:56px; padding:10px 14px; } .brand span,.hint { display:none; } .stage { width:100vw; height:56.25vw; max-height:none; } main { padding:0; } footer { min-height:58px; padding:12px 14px; gap:10px; } .tools button { min-width:34px; padding:0 7px; } .gesture-panel { width:156px; min-width:0; bottom:66px; right:10px; } }

  <div class="app">
    <header><div class="brand"><strong>流芳百世</strong><span>INTERACTIVE EDITION · 2026</span></div><div class="tools"><button id="gestureBtn" aria-label="开启手势控制">手势</button><button id="tocBtn" aria-label="目录">目录</button><button id="fullBtn" aria-label="全屏">全屏</button></div></header>

    function applyHand(landmarks,now){if(!landmarks){resetGesture();setGestureMessage('未检测到手部','请将手掌举到摄像头前');return}const x=1-landmarks[9].x;const side=x<.35?'left':x>.65?'right':'';stage.classList.toggle('gesture-left',side==='left');stage.classList.toggle('gesture-right',side==='right');if(!side){dwellSide='';setGestureMessage('手势已识别','把手移动到预览画面的左侧或右侧');return}if(side!==dwellSide){dwellSide=side;dwellStarted=now}const elapsed=now-dwellStarted;const remaining=Math.max(0,900-elapsed);const action=side==='left'?'上一页':'下一页';setGestureMessage(`准备${action}`,`保持手势 ${Math.ceil(remaining/100)/10} 秒`);if(elapsed>=900&&now>cooldownUntil){go(current+(side==='left'?-1:1));cooldownUntil=now+1500;dwellStarted=now+700;setGestureMessage(`已${action}`,'移开手或换边继续浏览')}}
    function detectHands(){if(!stream)return;const now=performance.now();if(camera.readyState>=2&&camera.currentTime!==lastVideoTime){lastVideoTime=camera.currentTime;const result=handLandmarker.detectForVideo(camera,now);const hand=result.landmarks?.[0];drawHand(hand);applyHand(hand,now)}raf=requestAnimationFrame(detectHands)}
    async function startGesture(){gestureButton.disabled=true;gesturePanel.classList.add('active');setGestureMessage('正在开启摄像头','首次使用将加载手势识别组件');try{const visionModule=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');const vision=await visionModule.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');handLandmarker=await visionModule.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.65,minTrackingConfidence:.55});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});camera.srcObject=stream;await camera.play();gesturePanel.classList.add('tracking');gestureButton.textContent='手势中';gestureButton.disabled=false;setGestureMessage('手势模式已开启','左侧停留翻上一页，右侧停留翻下一页');detectHands()}catch(error){console.error(error);gestureButton.disabled=false;gesturePanel.classList.remove('tracking');setGestureMessage('无法开启手势模式','请允许摄像头权限，并在联网环境下重新尝试')}}
    function stopGesture(){cancelAnimationFrame(raf);stream?.getTracks().forEach(track=>track.stop());stream=null;handLandmarker?.close?.();handLandmarker=null;camera.srcObject=null;gesturePanel.classList.remove('active','tracking');gestureButton.textContent='手势';resetGesture();handCtx.clearRect(0,0,handCanvas.width,handCanvas.height)}
    gestureButton.onclick=()=>stream?stopGesture():startGesture();document.querySelector('#gestureOff').onclick=stopGesture;window.addEventListener('beforeunload',stopGesture);
    initSoftBook();
    render(1);
  </script>
</body>
</html>
