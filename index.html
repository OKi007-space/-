<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171716">
  <title>流芳百世 - 互动电子书</title>
  <style>
    :root { --paper:#f8f7f2; --ink:#272725; --accent:#a35a45; --line:rgba(255,255,255,.18); }
    * { box-sizing:border-box; } html,body { height:100%; margin:0; }
    body { overflow:hidden; color:#f8f7f2; background:radial-gradient(circle at 50% 35%,#45433e 0,#22221f 48%,#111 100%); font-family:"Noto Serif SC","Songti SC",serif; }
    button { font:inherit; color:inherit; border:0; cursor:pointer; }
    .app { min-height:100%; display:grid; grid-template-rows:auto 1fr auto; }
    header { min-height:64px; display:flex; align-items:center; justify-content:space-between; padding:14px clamp(18px,4vw,56px); border-bottom:1px solid var(--line); letter-spacing:.12em; }
    .brand { display:flex; flex-direction:column; gap:3px; } .brand strong { font-size:18px; font-weight:600; } .brand span { color:#c9c5b9; font:11px/1.2 system-ui,sans-serif; letter-spacing:.18em; }
    .tools { display:flex; align-items:center; gap:10px; } .tools button,.close { min-width:36px; height:36px; padding:0 10px; border-radius:18px; background:rgba(255,255,255,.08); transition:.2s; } .tools button:hover,.close:hover { background:rgba(255,255,255,.18); }
    main { min-height:0; position:relative; display:grid; place-items:center; padding:20px 16px; }
    .stage { width:min(92vw,1480px); height:min(75vh,calc(92vw * .5625)); max-height:calc(100vh - 165px); position:relative; perspective:2200px; user-select:none; touch-action:pan-y; }
    .sheet { position:absolute; inset:0; background:#0d0d0c; box-shadow:0 28px 70px rgba(0,0,0,.55); overflow:hidden; }
    .sheet img { width:100%; height:100%; display:block; object-fit:contain; }
    .turn { position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d; pointer-events:none; z-index:3; }
    .turn img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#0d0d0c; backface-visibility:hidden; }
    .turn::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 20%,transparent 78%,rgba(0,0,0,.28)); opacity:.25; backface-visibility:hidden; }
    .turn.flip { animation:turn 620ms cubic-bezier(.3,.08,.12,1) forwards; } @keyframes turn { 0%{transform:rotateY(0)} 100%{transform:rotateY(-180deg)} }
    .shade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 8%,transparent 92%,rgba(0,0,0,.18)); box-shadow:inset 0 0 28px rgba(0,0,0,.34); z-index:4; }
    .tap { position:absolute; top:0; bottom:0; width:24%; z-index:5; background:transparent; } .tap.prev { left:0; } .tap.next { right:0; }
    .tap:focus-visible { outline:2px solid #fff; outline-offset:-4px; }
    footer { min-height:64px; display:flex; align-items:center; gap:18px; padding:14px clamp(18px,4vw,56px); border-top:1px solid var(--line); font:12px/1 system-ui,sans-serif; color:#d5d2c9; }
    #label { min-width:84px; } input[type=range] { flex:1; accent-color:#d1a474; cursor:pointer; } .hint { opacity:.7; white-space:nowrap; }
    dialog { width:min(760px,92vw); max-height:78vh; color:var(--ink); background:#f5f2ea; border:0; border-radius:12px; padding:0; box-shadow:0 26px 80px #000; } dialog::backdrop { background:rgba(0,0,0,.67); backdrop-filter:blur(4px); }
    .toc-head { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 12px; border-bottom:1px solid #d8d3c8; } .toc-head h2 { margin:0; font-size:18px; font-weight:600; }
    #toc { padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:10px; overflow:auto; max-height:62vh; }
    .thumb { color:#403f3b; text-align:left; background:#fff; padding:6px; border-radius:5px; box-shadow:0 1px 5px #bdb8ae; } .thumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#ddd; } .thumb span { display:block; font-size:11px; padding:6px 2px 1px; } .thumb[aria-current=true] { outline:3px solid var(--accent); }
    @media (max-width:620px) { header { min-height:56px; padding:10px 14px; } .brand span,.hint { display:none; } .stage { width:100vw; height:56.25vw; max-height:none; } main { padding:0; } footer { min-height:58px; padding:12px 14px; gap:10px; } .tools button { min-width:34px; padding:0 7px; } }
  </style>
</head>
<body>
  <div class="app">
    <header><div class="brand"><strong>流芳百世</strong><span>INTERACTIVE EDITION · 2026</span></div><div class="tools"><button id="tocBtn" aria-label="目录">目录</button><button id="fullBtn" aria-label="全屏">全屏</button></div></header>
    <main><div class="stage" id="stage" aria-label="电子书阅读器"><div class="sheet"><img id="page" alt="流芳百世页面"></div><div class="shade"></div><button class="tap prev" id="prev" aria-label="上一页"></button><button class="tap next" id="next" aria-label="下一页"></button></div></main>
    <footer><span id="label">第 1 / 30 页</span><input id="progress" type="range" min="1" max="30" value="1" aria-label="阅读进度"><span class="hint">← → 翻页 · 点击两侧 · 拖拽/滑动</span></footer>
  </div>
  <dialog id="tocDialog"><div class="toc-head"><h2>目录</h2><button class="close" id="closeToc" aria-label="关闭目录">关闭</button></div><div id="toc"></div></dialog>
  <script>
    const total=30, pad=n=>String(n).padStart(2,'0'), src=n=>`assets/page-${pad(n)}.png`;
    const page=document.querySelector('#page'), label=document.querySelector('#label'), progress=document.querySelector('#progress'), stage=document.querySelector('#stage');
    let current=1, locked=false, startX=null;
    function render(n){ current=Math.max(1,Math.min(total,n)); page.src=src(current); page.alt=`《流芳百世》第 ${current} 页`; label.textContent=`第 ${current} / ${total} 页`; progress.value=current; document.querySelectorAll('.thumb').forEach(x=>x.setAttribute('aria-current',Number(x.dataset.page)===current)); }
    function go(n,animate=true){ n=Math.max(1,Math.min(total,n)); if(n===current||locked)return; if(!animate){render(n);return} locked=true; const leaf=document.createElement('div'); leaf.className='turn'; const image=document.createElement('img'); image.src=src(current); image.alt=''; leaf.append(image); stage.prepend(leaf); requestAnimationFrame(()=>leaf.classList.add('flip')); leaf.addEventListener('animationend',()=>{render(n);leaf.remove();locked=false},{once:true}); }
    document.querySelector('#next').onclick=()=>go(current+1); document.querySelector('#prev').onclick=()=>go(current-1);
    progress.oninput=e=>go(Number(e.target.value),false);
    document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return; if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(1);if(e.key==='End')go(total)});
    stage.addEventListener('pointerdown',e=>{startX=e.clientX}); stage.addEventListener('pointerup',e=>{if(startX===null)return;const d=e.clientX-startX;if(Math.abs(d)>42)go(current+(d<0?1:-1));startX=null});
    const dialog=document.querySelector('#tocDialog'),toc=document.querySelector('#toc');
    for(let i=1;i<=total;i++){const b=document.createElement('button');b.className='thumb';b.dataset.page=i;b.innerHTML=`<img loading="lazy" src="${src(i)}" alt="第 ${i} 页缩略图"><span>第 ${i} 页</span>`;b.onclick=()=>{go(i,false);dialog.close()};toc.append(b)}
    document.querySelector('#tocBtn').onclick=()=>{render(current);dialog.showModal()}; document.querySelector('#closeToc').onclick=()=>dialog.close();
    document.querySelector('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    render(1);
  </script>
</body>
</html>
